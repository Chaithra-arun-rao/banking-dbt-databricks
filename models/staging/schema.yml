version: 2

models:

  - name: stg_customers
    columns:

      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: risk_rating
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: stg_accounts
    columns:

      - name: account_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

  - name: stg_transactions
    columns:

      - name: transaction_id
        data_tests:
          - unique
          - not_null

      - name: account_id
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

  - name: stg_loans
    columns:

      - name: loan_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

  - name: stg_branches
    columns:

      - name: branch_id
        data_tests:
          - unique
          - not_null